<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSecLab - Seu Dashboard Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <div id="toast" class="toast-hidden fixed top-5 right-5 shadow-lg rounded-lg p-4 border-l-4 z-50">
        <p id="toast-msg" class="font-semibold"></p>
    </div>

    <main id="auth-section" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md auth-card">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tight">FinSecLab</h1>
                <p class="text-slate-500 mt-2 text-sm">Acesso seguro e inteligente.</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">E-mail</label>
                    <input type="email" id="login-email" required class="input-padrao" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Senha</label>
                    <input type="password" id="login-senha" required class="input-padrao" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary w-full">Acessar Conta</button>
                <p class="text-center text-sm text-slate-500 mt-4">Novo por aqui? <a href="#" onclick="toggleAuth()" class="text-indigo-600 font-bold hover:underline">Crie sua conta</a></p>
            </form>

            <form id="register-form" class="space-y-5 hidden">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Nome de Usuário</label>
                    <input type="text" id="reg-username" required class="input-padrao" placeholder="mínimo 6 caracteres">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">E-mail</label>
                    <input type="email" id="reg-email" required class="input-padrao" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Senha</label>
                    <input type="password" id="reg-senha" required class="input-padrao" placeholder="mín. 8 chars e 1 número">
                </div>
                <button type="submit" class="btn-success w-full">Finalizar Cadastro</button>
                <p class="text-center text-sm text-slate-500 mt-4">Já tem uma conta? <a href="#" onclick="toggleAuth()" class="text-indigo-600 font-bold hover:underline">Faça Login</a></p>
            </form>
        </div>
    </main>

    <main id="dashboard-section" class="hidden flex-grow flex flex-col fade-in">
        <header class="bg-white shadow-sm border-b border-slate-200 p-4 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-extrabold text-indigo-600 tracking-tight">FinSecLab</h1>
                <button onclick="logout()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-4 rounded-lg font-semibold transition-colors duration-200">Sair da Conta</button>
            </div>
        </header>

        <div class="max-w-6xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-8 col-span-1">
                <div class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 p-8 rounded-3xl shadow-xl text-white relative overflow-hidden">
                    <div class="relative z-10">
                        <h2 class="text-indigo-200 font-semibold text-xs uppercase tracking-widest mb-1">Saldo Disponível</h2>
                        <p class="text-4xl font-black mt-1 tracking-tight" id="saldo-display">R$ 0,00</p>
                    </div>
                    <div class="absolute -bottom-6 -right-6 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-xl text-slate-800 mb-5">Nova Movimentação</h3>
                    <form id="transacao-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Descrição</label>
                            <input type="text" id="trans-desc" required placeholder="Mínimo 6 letras" class="input-padrao mt-1">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Valor (R$)</label>
                            <input type="number" id="trans-valor" step="0.01" min="0.01" required placeholder="0,00" class="input-padrao mt-1">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Tipo</label>
                            <select id="trans-tipo" class="input-padrao mt-1 bg-white">
                                <option value="GANHO">Receita (+)</option>
                                <option value="GASTO">Despesa (-)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary w-full mt-2">Registrar</button>
                    </form>
                </div>
            </div>

            <div class="col-span-1 lg:col-span-2 bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col">
                <h3 class="font-bold text-xl text-slate-800 mb-6">Últimas Transações</h3>
                <div class="overflow-x-auto flex-grow">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-slate-100 text-xs text-slate-400 uppercase tracking-wider">
                                <th class="pb-4 font-semibold w-1/2">Descrição</th>
                                <th class="pb-4 font-semibold text-center">Tipo</th>
                                <th class="pb-4 font-semibold text-right">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="extrato-body" class="text-sm divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
